[package]
name = "rust_crawler"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Mock server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }

# Serialization
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# CSV parsing with encoding support
csv = "1.3"
encoding_rs = "0.8"

# HTML parsing and text extraction
select = "0.6"
scraper = "0.17"

# Performance measurement
criterion = "0.5"

# Concurrency
rayon = "1.8"
futures = "0.3"

# Utilities
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"